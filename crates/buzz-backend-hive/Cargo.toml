[package]
name = "buzz-backend-hive"
description = "Buzz desktop provider shim: deploys agents to a hive host over SSH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The FILENAME is what Buzz shows in its picker: the desktop discovers
# `buzz-backend-*` executables and derives the displayed name from the suffix.
[[bin]]
name = "buzz-backend-hive"
path = "src/main.rs"

[dependencies]
hive-spec.workspace = true
hive-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
